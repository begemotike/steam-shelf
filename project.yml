name: SteamShelf
options:
  bundleIdPrefix: net.outofajam
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      ENABLE_HARDENED_RUNTIME: YES
targets:
  SteamShelf:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: SteamShelf
        CFBundleDisplayName: Steam Shelf
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.entertainment
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 Out of a Jam"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: net.outofajam.steamshelf
            UTTypeDescription: Steam Shelf Document
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [steamshelf]
    entitlements:
      path: Resources/SteamShelf.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.outofajam.SteamShelf
        PRODUCT_NAME: SteamShelf
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        COMBINE_HIDPI_IMAGES: YES
  SteamShelfTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: SteamShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.outofajam.SteamShelfTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SteamShelf.app/Contents/MacOS/SteamShelf"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SteamShelf:
    build:
      targets:
        SteamShelf: all
        SteamShelfTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SteamShelfTests
