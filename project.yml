name: SteamShelf
options:
  bundleIdPrefix: net.outofajam
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: 9JHK4XRFW5
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      # Same Developer ID as Release so the app's identity is stable across rebuilds (otherwise the
      # Keychain asks for the password after every build). Hardened runtime off so the test bundle can inject.
      CODE_SIGN_IDENTITY: "Developer ID Application"
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      ENABLE_HARDENED_RUNTIME: YES
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"
targets:
  SteamShelf:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: Sparkle
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: SteamShelf
        CFBundleDisplayName: Steam Shelf
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUFeedURL: https://raw.githubusercontent.com/begemotike/steam-shelf/main/appcast.xml
        SUPublicEDKey: m31KMT9jEPbtlQmH//YFxSkEoC9YIwVlWCGZfXplfe4=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        # Sparkle inside the App Sandbox: the installer runs through an XPC service.
        SUEnableInstallerLauncherService: true
        LSApplicationCategoryType: public.app-category.entertainment
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 Out of a Jam"
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: net.outofajam.steamshelf.box
            UTTypeDescription: Steam Shelf Box Drag
            UTTypeConformsTo: [public.data]
          - UTTypeIdentifier: net.outofajam.steamshelf
            UTTypeDescription: Steam Shelf Document
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [steamshelf]
    entitlements:
      path: Resources/SteamShelf.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        # Read-only peek at the Steam client's library manifest so the box can say Play vs Install.
        com.apple.security.temporary-exception.files.home-relative-path.read-only:
          - /Library/Application Support/Steam/steamapps/
        # Sparkle's sandboxed installer XPC services (per Sparkle's sandboxing guide).
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.outofajam.SteamShelf
        PRODUCT_NAME: SteamShelf
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        COMBINE_HIDPI_IMAGES: YES
  SteamShelfTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: SteamShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.outofajam.SteamShelfTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SteamShelf.app/Contents/MacOS/SteamShelf"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  SteamShelf:
    build:
      targets:
        SteamShelf: all
        SteamShelfTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SteamShelfTests
